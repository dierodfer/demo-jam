# Servicio PostgreSQL del portal.
#
# Se incluye desde docker-compose.java-react.yml o se levanta solo con
# `make db-up` para el desarrollo local.
#
# Para desarrollo local, `make db-up` levanta este servicio y el backend Java
# se conecta a localhost:5432.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-portal}
      POSTGRES_USER: ${DB_USER:-portal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portal}
    ports:
      - "5432:5432"
    volumes:
      - portal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portal} -d ${DB_NAME:-portal}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  portal-db-data:
