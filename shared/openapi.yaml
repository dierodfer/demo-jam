openapi: 3.1.0
info:
  title: Portal de Empleado API
  version: "1.0.0"
  description: >
    Contrato de API del Portal de Empleado, implementado por el backend Java
    en el puerto 8080.

    Autenticación: login basado en sesión. El username debe coincidir con un
    empleado de la base de datos. Si el empleado tiene contraseña guardada
    (hash), debe coincidir; si no la tiene, cualquier contraseña es válida
    (login simulado). La sesión se mantiene mediante la cookie JSESSIONID.

servers:
  - url: http://localhost:8080
    description: Backend Java

tags:
  - name: auth
    description: Login / logout simulado basado en sesión
  - name: profile
    description: Perfil del empleado autenticado
  - name: certificaciones
    description: Conocimientos / certificaciones del empleado (CRUD)
  - name: empleados
    description: Directorio mínimo de empleados
  - name: objetos-perdidos
    description: Objetos perdidos y encontrados en la oficina, reclamaciones y entregas

paths:
  /api/login:
    post:
      tags: [auth]
      summary: Inicia sesión
      description: >
        Busca al empleado por username. Si tiene contraseña guardada, debe
        coincidir; si no, la contraseña se ignora (cualquier valor es válido).
        Si es correcto abre una sesión y devuelve la cookie de sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login correcto. Se establece la cookie de sesión.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie de sesión JSESSIONID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleado'
        '401':
          description: Username desconocido o contraseña incorrecta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me:
    get:
      tags: [profile]
      summary: Devuelve el perfil del empleado autenticado
      responses:
        '200':
          description: Perfil del empleado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleado'
        '401':
          description: No hay sesión activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [profile]
      summary: Actualiza el perfil del empleado autenticado
      description: >
        Actualiza los campos editables del perfil. El id se ignora en el
        cuerpo; siempre se actualiza el empleado de la sesión activa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpleadoUpdate'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleado'
        '401':
          description: No hay sesión activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/logout:
    post:
      tags: [auth]
      summary: Cierra la sesión
      responses:
        '204':
          description: Sesión cerrada. La cookie de sesión queda invalidada.

  /api/certificaciones:
    get:
      tags: [certificaciones]
      summary: Lista los conocimientos / certificaciones del empleado autenticado
      responses:
        '200':
          description: Lista de certificaciones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Certificacion'
        '401':
          description: No hay sesión activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [certificaciones]
      summary: Crea una certificación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificacionInput'
      responses:
        '201':
          description: Certificación creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificacion'
        '401':
          description: No hay sesión activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/certificaciones/{id}:
    put:
      tags: [certificaciones]
      summary: Actualiza una certificación
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificacionInput'
      responses:
        '200':
          description: Certificación actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificacion'
        '401':
          description: No hay sesión activa.
        '404':
          description: No existe o no pertenece al empleado.
    delete:
      tags: [certificaciones]
      summary: Elimina una certificación
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Certificación eliminada.
        '401':
          description: No hay sesión activa.
        '404':
          description: No existe o no pertenece al empleado.

  /api/empleados:
    get:
      tags: [empleados]
      summary: Directorio mínimo de empleados
      description: Solo id, nombre, foto y departamento. Sirve para elegir destinatario de una entrega.
      responses:
        '200':
          description: Lista de empleados ordenada por nombre.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmpleadoResumen'
        '401':
          description: No hay sesión activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/objetos-perdidos:
    get:
      tags: [objetos-perdidos]
      summary: Lista los objetos perdidos y encontrados (visibles para todos los empleados)
      parameters:
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoObjeto'
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoObjeto'
        - name: categoria
          in: query
          schema:
            $ref: '#/components/schemas/CategoriaObjeto'
        - name: seccion
          in: query
          schema:
            $ref: '#/components/schemas/SeccionOficina'
        - name: q
          in: query
          description: Búsqueda por título, descripción o ubicación.
          schema:
            type: string
        - name: mios
          in: query
          description: Solo los objetos publicados por el empleado de la sesión.
          schema:
            type: boolean
        - name: reclamados
          in: query
          description: Solo los objetos que el empleado de la sesión ha reclamado.
          schema:
            type: boolean
      responses:
        '200':
          description: Objetos, del más reciente al más antiguo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjetoPerdido'
        '401':
          description: No hay sesión activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [objetos-perdidos]
      summary: Publica un objeto perdido o encontrado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjetoPerdidoInput'
      responses:
        '201':
          description: Objeto publicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjetoPerdido'
        '400':
          description: Faltan campos obligatorios o algún valor no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No hay sesión activa.

  /api/objetos-perdidos/resumen:
    get:
      tags: [objetos-perdidos]
      summary: Contadores para el badge de novedades
      description: >
        objetosNuevos cuenta los objetos abiertos publicados por otros en los
        últimos 7 días. reclamacionesPendientes cuenta las reclamaciones sin
        resolver de los objetos abiertos del empleado.
      responses:
        '200':
          description: Resumen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenObjetos'
        '401':
          description: No hay sesión activa.

  /api/objetos-perdidos/{id}:
    parameters:
      - $ref: '#/components/parameters/ObjetoId'
    get:
      tags: [objetos-perdidos]
      summary: Detalle de un objeto
      responses:
        '200':
          description: Objeto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjetoPerdido'
        '401':
          description: No hay sesión activa.
        '404':
          description: No existe.
    put:
      tags: [objetos-perdidos]
      summary: Actualiza un objeto abierto (solo su publicador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjetoPerdidoInput'
      responses:
        '200':
          description: Objeto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjetoPerdido'
        '400':
          description: Datos no válidos.
        '401':
          description: No hay sesión activa.
        '404':
          description: No existe o no lo ha publicado el empleado.
        '409':
          description: El objeto ya está entregado.
    delete:
      tags: [objetos-perdidos]
      summary: Elimina un objeto y sus reclamaciones (solo su publicador)
      responses:
        '204':
          description: Objeto eliminado.
        '401':
          description: No hay sesión activa.
        '404':
          description: No existe o no lo ha publicado el empleado.

  /api/objetos-perdidos/{id}/entrega:
    post:
      tags: [objetos-perdidos]
      summary: Da el objeto por entregado (solo su publicador)
      description: >
        Marca el objeto como entregado. Las reclamaciones pendientes del
        destinatario pasan a aceptada y las demás a rechazada. En un objeto
        encontrado el objeto pasa del publicador al destinatario; en uno
        perdido, del destinatario (quien lo encontró) al publicador.
      parameters:
        - $ref: '#/components/parameters/ObjetoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntregaInput'
      responses:
        '200':
          description: Objeto entregado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjetoPerdido'
        '400':
          description: Destinatario inexistente o igual al publicador.
        '401':
          description: No hay sesión activa.
        '404':
          description: No existe o no lo ha publicado el empleado.
        '409':
          description: El objeto ya está entregado.

  /api/objetos-perdidos/{id}/reclamaciones:
    parameters:
      - $ref: '#/components/parameters/ObjetoId'
    get:
      tags: [objetos-perdidos]
      summary: Lista las reclamaciones del objeto (solo su publicador)
      responses:
        '200':
          description: Reclamaciones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reclamacion'
        '401':
          description: No hay sesión activa.
        '404':
          description: No existe o no lo ha publicado el empleado.
    post:
      tags: [objetos-perdidos]
      summary: Reclama un objeto de otro empleado
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReclamacionInput'
      responses:
        '201':
          description: Reclamación creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reclamacion'
        '400':
          description: El empleado no puede reclamar su propio objeto.
        '401':
          description: No hay sesión activa.
        '404':
          description: No existe.
        '409':
          description: El objeto ya está entregado o el empleado ya lo reclamó.

  /api/objetos-perdidos/{id}/reclamaciones/{reclamacionId}:
    put:
      tags: [objetos-perdidos]
      summary: Acepta o rechaza una reclamación (solo el publicador)
      parameters:
        - $ref: '#/components/parameters/ObjetoId'
        - name: reclamacionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReclamacionUpdate'
      responses:
        '200':
          description: Reclamación actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reclamacion'
        '400':
          description: El estado debe ser aceptada o rechazada.
        '401':
          description: No hay sesión activa.
        '404':
          description: No existe o el objeto no lo ha publicado el empleado.
        '409':
          description: La reclamación ya está resuelta o el objeto está entregado.

components:
  parameters:
    ObjetoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          description: Solo se valida si el empleado tiene contraseña guardada; en otro caso se ignora.
          example: cualquier-cosa

    Empleado:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Ana García
        email:
          type: string
          example: ana.garcia@empresa.com
        telefono:
          type: string
          example: "+34 600 123 456"
        puesto:
          type: string
          example: Desarrolladora Full Stack
        departamento:
          type: string
          example: Tecnología
        direccion:
          type: string
          example: Calle Mayor 1, 28013 Madrid
        foto:
          type: string
          description: URL o data URI de la foto de perfil.
          example: https://i.pravatar.cc/300?u=ana

    EmpleadoUpdate:
      type: object
      description: Campos editables del perfil (los 7 campos, sin id).
      properties:
        nombre:
          type: string
        email:
          type: string
        telefono:
          type: string
        puesto:
          type: string
        departamento:
          type: string
        direccion:
          type: string
        foto:
          type: string

    Certificacion:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        conocimiento:
          type: string
          example: AWS Certified Developer – Associate
        empresaEmisora:
          type: string
          example: AWS
        fecha:
          type: string
          description: Fecha de emisión (YYYY-MM-DD).
          example: "2025-11-17"

    CertificacionInput:
      type: object
      description: Campos editables de una certificación (sin id).
      required: [conocimiento]
      properties:
        conocimiento:
          type: string
        empresaEmisora:
          type: string
        fecha:
          type: string
          example: "2025-11-17"

    EmpleadoResumen:
      type: object
      description: Datos públicos mínimos de un empleado (sin username ni email).
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        foto:
          type: string
        departamento:
          type: string

    TipoObjeto:
      type: string
      enum: [perdido, encontrado]

    EstadoObjeto:
      type: string
      enum: [abierto, entregado]

    CategoriaObjeto:
      type: string
      enum: [llaves, movil, cartera, ropa, auriculares, documentos, otros]

    SeccionOficina:
      type: string
      enum: [recepcion, planta1, planta2, sala-reuniones, cocina, parking, otras]

    ObjetoPerdido:
      type: object
      properties:
        id:
          type: integer
          format: int64
        titulo:
          type: string
          example: Llaves con llavero azul
        descripcion:
          type: string
        categoria:
          $ref: '#/components/schemas/CategoriaObjeto'
        tipo:
          $ref: '#/components/schemas/TipoObjeto'
        estado:
          $ref: '#/components/schemas/EstadoObjeto'
        seccion:
          $ref: '#/components/schemas/SeccionOficina'
        ubicacion:
          type: string
          description: Lugar exacto dentro de la sección.
          example: Mesa junto a la ventana
        fechaSuceso:
          type: string
          description: Desde cuándo está perdido o encontrado (YYYY-MM-DD).
          example: "2026-09-28"
        fechaPublicacion:
          type: string
          example: "2026-09-29"
        fechaEntrega:
          type: string
          nullable: true
          example: "2026-09-30"
        publicador:
          $ref: '#/components/schemas/EmpleadoResumen'
        contraparte:
          allOf:
            - $ref: '#/components/schemas/EmpleadoResumen'
          nullable: true
          description: Destinatario de la entrega; solo existe si el objeto está entregado.
        esMio:
          type: boolean
          description: El empleado de la sesión es el publicador.
        miReclamacion:
          type: string
          nullable: true
          enum: [pendiente, aceptada, rechazada]
          description: Estado de la reclamación del empleado de la sesión, si existe.
        reclamacionesPendientes:
          type: integer
          description: Reclamaciones sin resolver; solo se informa al publicador (0 para el resto).

    ObjetoPerdidoInput:
      type: object
      required: [titulo, tipo, categoria, seccion]
      properties:
        titulo:
          type: string
        descripcion:
          type: string
        categoria:
          $ref: '#/components/schemas/CategoriaObjeto'
        tipo:
          $ref: '#/components/schemas/TipoObjeto'
        seccion:
          $ref: '#/components/schemas/SeccionOficina'
        ubicacion:
          type: string
        fechaSuceso:
          type: string
          description: YYYY-MM-DD. Si falta, se usa la fecha actual.

    EntregaInput:
      type: object
      required: [contraparteId]
      properties:
        contraparteId:
          type: integer
          format: int64
          description: Id del empleado destinatario (de GET /api/empleados).

    Reclamacion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        objetoId:
          type: integer
          format: int64
        mensaje:
          type: string
        estado:
          type: string
          enum: [pendiente, aceptada, rechazada]
        fecha:
          type: string
          example: "2026-09-30"
        reclamante:
          $ref: '#/components/schemas/EmpleadoResumen'

    ReclamacionInput:
      type: object
      properties:
        mensaje:
          type: string

    ReclamacionUpdate:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [aceptada, rechazada]

    ResumenObjetos:
      type: object
      properties:
        objetosNuevos:
          type: integer
        reclamacionesPendientes:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
          example: No autenticado
