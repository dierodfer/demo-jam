name: CI Frontend

on:
  push:
    branches:
      - "**"
    paths:
      - "frontend-react/**"
  pull_request:
    branches:
      - main
    paths:
      - "frontend-react/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: React
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Instalar dependencias React
        run: make install-react-ci

      - name: Construir frontend React
        run: make build-react
